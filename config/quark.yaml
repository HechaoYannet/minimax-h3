# 夸克网盘接入（WebUI「网盘」页签）
# ---------------------------------------------------------------------------
# 用途：把生成出来的视频**原样**打成一个加密 zip 再上传到夸克网盘，给一条分享链接，
#       拿到链接的人用网盘客户端下载：
#         · 网络慢的时候，下载速度由夸克决定，不再占这台机器的上行带宽；
#         · 内容被加密包住，网盘的自动内容抽检扫不到里面是什么。
#       反向也支持：浏览/搜索网盘里的文件，下载回 workspace/ 当参考素材。
#
# 【重要】默认**不重新编码、不掉画质**：传上去的就是原始 mp4，只是外面套了一层加密 zip。
#       体积也不会因为套 zip 变小（mp4 早压过了），要压小请显式打开下面的 compress。
#
# 这份文件与 server.yaml / deepseek.yaml 一样是**热读取**：改完刷新页面即可生效。
#
# 与 quarkclouddrive CLI 的关系：本服务只是它的调用方，账号授权（login）由 CLI 自己维护，
# 本服务不接触、也不保存你的 access_token。

enabled: true

# ------------------------------------------------------------------ CLI 运行方式
# 后端跑在 WSL 里，而 quarkclouddrive CLI 需要 Node.js。两个跑法：
#   linux   —— WSL 里装了 Node（node 在 PATH 上），参数用 /mnt/d/... 形式的路径
#   windows —— 用 Windows 侧的 node.exe，经 WSL interop 调用
#              （本机现状就是这个：WSL 没有 Node，Windows 有 v24）
#   auto    —— 先找 Linux node，找不到再退回 Windows node.exe（默认）
runner: auto

# CLI 入口（相对仓库根，或绝对路径）
cli: web_disk/quarkclouddrive-1.0.20/scripts/quark-drive.cjs

# 指定 node / node.exe 的绝对路径；留空自动探测
node: ""

# ------------------------------------------------------------------ agent 环境
# CLI 会先判断「自己是不是在被支持的 agent 环境里跑」，认不出来就直接
# {"code":-104,"msg":"无法识别当前 Agent 环境，禁止继续使用"}。
# 本服务是 DeepSeek 渠道的创作台，所以按官方渠道标识注入以下环境变量
# （Windows runner 下经 WSLENV 透传，值本身不参与任何校验）。
agent:
  id: deepseek
  dsh_home: ""
  session_input: MiniMax-H3 创作台

# ------------------------------------------------------------------ 重新编码（默认关）
# 打开后会用 ffmpeg 转码把视频压小（CRF 越大越小越糊，最长边只缩不放）。
# **这是有损的**：画质会掉，所以默认关闭 —— 本功能的目的是「把原件安全地搬走」，不是压片。
# 只有明确想省流量/省网盘空间时才打开，页面上也能针对单次上传临时勾选。
compress:
  enabled: false
  crf: 26
  preset: veryfast
  max_edge: 1280
  audio_bitrate: 96k
  pix_fmt: yuv420p

# ------------------------------------------------------------------ 加密压缩包（防抽检的核心）
# 视频必须打成**带密码的** zip 再上传，密码统一：123456
#   · 加密后 zip 里的内容是密文，网盘的自动内容抽检解不开；
#   · 分享链接本身的提取码由夸克服务端生成、调用方指定不了，所以「统一密码」只能落在压缩包上。
# level 是 deflate 压缩级别：视频已经压过，deflate 只能省 1% 左右，纯粹白烧 CPU，
# 所以默认 0（只打包不压缩，秒级完成）。要塞文档/图片这类可压的东西再调回 6。
# 注意：zip 的文件名本身是明文（格式如此），被加密的只有内容。文件名会按 UTF-8 正确写入。
#
# tool 选打包实现：
#   auto   —— 优先用 bsdtar（Windows 自带的 C:\Windows\System32\tar.exe 就是 libarchive 版），
#             写完会用标准库验一遍密码；没有可用的 bsdtar 就退回纯 Python 实现
#   tar    —— 强制 bsdtar（失败就报错，不悄悄降级）
#   python —— 强制纯 Python（慢，约 2 MiB/s，只在排查问题时用）
archive:
  enabled: true
  password: "123456"
  level: 0
  tool: auto
  tar_bin: ""

# ------------------------------------------------------------------ 分享链接
# url_type: 1=公开链接（拿到链接即可下载）  2=私密链接（夸克额外生成一个提取码）
# expired_type: 1=永久 2=1天 3=7天 4=30天 5=60天 6=100天 7=180天
share:
  enabled: true
  url_type: 1
  expired_type: 1
  title: MiniMax-H3 生成视频

# ------------------------------------------------------------------ 网盘目录
# 【实测坑】CLI 的「内部默认目录」在这条链路上是空的：省略 --parent-fid 会直接
#   参数错误: [upload dir blank]（官方文档说的「省略就交给 CLI 内部默认行为」并不成立）。
# 所以这里的策略是：
#   parent_fid 非空 —— 直接传到那个目录（"0" = 根目录，只有你明确要才填）；
#   parent_fid 留空 —— 用 dir_name 指定的目录名，先建/复用同名目录（CLI 对同名创建是幂等的），
#                      再传进去。依然不碰根目录 "0"。
#   dir_name 也留空 —— 才真的省略目录参数（会撞上上面那个报错，仅用于对照排查）。
upload:
  parent_fid: ""
  dir_name: MiniMax-H3

# 从网盘下载回来的文件放哪（相对仓库根）
download:
  dir: workspace/netdisk

# 上传完成后是否保留中间的打包件（cache/webui/disk/<任务ID>/）
keep_work: true